[package]
name = "actor_static"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-util = { version = "0.7.17" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
  "env-filter",
  "fmt"
] }

[profile.release]
strip = "symbols"
lto = "thin"
panic = "abort"
codegen-units = 1
